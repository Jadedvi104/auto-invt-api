name: Inventory API CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory_ci_only
          POSTGRES_DB: inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory -d inventory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://inventory:inventory_ci_only@localhost:5432/inventory_test
      TEST_DATABASE_URL: postgresql+psycopg://inventory:inventory_ci_only@localhost:5432/inventory_test
      POSTGRES_PASSWORD: inventory_ci_only
      POSTGRES_DB: inventory_compose
      POSTGRES_PORT: "15432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check lint and formatting
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Rehearse migration upgrade and rollback
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Run tests against PostgreSQL
        run: uv run pytest -v
      - name: Build distribution
        run: uv build
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start containers and wait for health
        run: docker compose up --detach --build --wait --wait-timeout 120
      - name: Exercise the running container API
        run: |
          curl --fail --silent --show-error http://localhost:8000/health/ready
          curl --fail --silent --show-error --output /dev/null http://localhost:8000/docs
          curl --fail --silent --show-error --request POST http://localhost:8000/api/v1/hosts --header 'Content-Type: application/json' --data '{"hostname":"compose-smoke","environment":"ci"}'
      - name: Show container logs after a failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers and remove CI data
        if: always()
        run: docker compose down --volumes --remove-orphans
